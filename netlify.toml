[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Old Square Online paths, so anything already indexed lands somewhere sensible.
[[redirects]]
  from = "/s/appointments"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/s/staff"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/s/instagram"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/visit/"
  status = 301

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
